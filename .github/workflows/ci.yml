# ---------------------------------------------------------------------------
# CI - on every push / PR
#   1. Django system checks + pending-migration check
#   2. pytest (with postgres + redis services) and a coverage gate (>=70%)
#   3. OpenAPI schema validation
#
# Secrets: none needed (dummy env for the tests is inline).
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:


# Default token permissions may be read-only for the repo - commenting the
# failure summary on the PR needs pull-requests:write.
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Django checks + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Python 3.11 installs Django 5.2 LTS, 3.12 installs Django 6
    # (pin: Django>=5.2.17,<6.1). Both paths are verified in CI.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: hospital
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-insecure-key-do-not-use-in-production
      DEBUG: "True"
      SAAS_ROOT_DOMAIN: testserver
      DATABASE_URL: postgres://hospital:hospital@127.0.0.1:5432/hospital_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      ML_MODEL_DIR: /tmp/ci_ml_models
      # ALLOWED_HOSTS is deliberately NOT set: settings derives a '.testserver'
      # wildcard from SAAS_ROOT_DOMAIN (testserver), and the Django test runner
      # adds 'testserver' itself. Setting '*' would make
      # test_unrelated_host_is_rejected_by_django fail (evil.com would be
      # allowed -> 302 instead of 400).

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (psycopg2 / Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Makemigrations dry-run (any pending migrations?)
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage (>=70% gate)
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=70 -q 2>&1 | tee pytest-output.txt

      # Downloading logs from the runner is often blocked outside GitHub, so
      # comment the failure summary straight on the PR - for debugging.
      - name: Comment failure summary on PR
        if: failure() && steps.pytest.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### pytest failed (run ${{ github.run_id }})"
            echo
            echo "#### Failed tests"
            echo '```'
            sed -n '/short test summary info/,/passed\|failed\|error/p' pytest-output.txt | head -n 60
            echo '```'
            echo
            echo "#### Tracebacks"
            echo '```'
            sed -n '/=\+ FAILURES =\+/,/=\+ \(warnings summary\|tests coverage\) =\+/p' pytest-output.txt | head -n 250
            echo '```'
          } > /tmp/pytest-summary.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file /tmp/pytest-summary.md

      # Keep a record of green runs on the PR too (counts + coverage TOTAL line).
      # Runner logs/artifacts are often not readable outside the GitHub sandbox.
      - name: Comment pass summary on PR
        if: success() && steps.pytest.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### pytest passed (run ${{ github.run_id }}, Python ${{ matrix.python-version }})"
            echo
            echo '```'
            python -c "import sys, django; print('Python', sys.version.split()[0], '| Django', django.get_version())"
            grep -E '^[0-9]+ passed|passed,|TOTAL' pytest-output.txt | tail -n 5
            echo '```'
          } > /tmp/pytest-pass.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file /tmp/pytest-pass.md

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/schema.yml --validate

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hospital-saas:ci .

      # Sanity check inside the image: Django check + migration state
      - name: Smoke test inside image
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-only-insecure-key \
            -e DEBUG=False \
            -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            -e SKIP_MIGRATIONS=1 \
            hospital-saas:ci python manage.py check
